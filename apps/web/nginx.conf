server {
	listen 80;
	root /usr/share/nginx/html;
	absolute_redirect off;

	location ~ ^/(auth/.*|projects|account|project/.*)$ {
		try_files /_shell.html =404;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/index.html =404;
	}
}
